traefik:
  # Default values for Traefik
  # This is a YAML-formatted file.
  # Declare variables to be passed into templates

  # -- Create a default IngressClass for Traefik
  ingressClass:  # @schema additionalProperties: false
    isDefaultClass: false

  # Traefik experimental features
  experimental:
    # -- Enable traefik experimental plugins
    plugins:
    # demo:
    #   moduleName: github.com/traefik/plugindemo
    #   version: v0.2.1
      plugin-rewritebody:
        moduleName: github.com/traefik/plugin-rewritebody
        version: v0.3.1

  ingressRoute:
    dashboard:
      # -- Create an IngressRoute for the dashboard
      enabled: true
      # -- The router match rule used for the dashboard ingressRoute
      matchRule:
      # -- Specify the allowed entrypoints to use for the dashboard ingress route, (e.g. traefik, web, websecure).
      # By default, it's using traefik entrypoint, which is not exposed.
      # /!\ Do not expose your dashboard without any protection over the internet /!\
      entryPoints:
      - websecure
      # -- Additional ingressRoute middlewares (e.g. for authentication)
      middlewares:
      - name: https-redirect
      - name: dashboard-auth
      # -- TLS options (e.g. secret containing certificate)
      tls:
        secretName: traefik-cert

  providers:  # @schema additionalProperties: false
    kubernetesCRD:
      # -- Allows IngressRoute to reference resources in namespace other than theirs
      allowCrossNamespace: true
      # -- Allows to reference ExternalName services in IngressRoute
      allowExternalNameServices: true

    kubernetesIngress:
      # -- When ingressClass is set, only Ingresses containing an annotation with the same value are processed. Otherwise, Ingresses missing the annotation, having an empty value, or the value traefik are processed.
      ingressClass: traefik # @schema type:[string, null]

  logs:
    general:
      # By default, the level is set to INFO.
      # -- Alternative logging levels are TRACE, DEBUG, INFO, WARN, ERROR, FATAL, and PANIC.
      level: TRACE
    access:
      # -- To enable access logs
      enabled: true

  # -- Global command arguments to be passed to all traefik's pods
  globalArguments: []

  ports:
    traefik:
      # Defines whether the port is exposed if service.type is LoadBalancer or
      # NodePort.
      #
      # -- You SHOULD NOT expose the traefik port on production deployments.
      # If you want to access it from outside your cluster,
      # use `kubectl port-forward` or create a secure ingress
      expose:
        default: true
    websecure:
      forwardedHeaders:
          # -- Trust forwarded headers information (X-Forwarded-*).
        trustedIPs:
        # Local
        - 192.168.1.0/24
        - 10.42.0.0/16

  service:
    # -- Additional annotations applied to both TCP and UDP services (e.g. for cloud provider specific config)
    annotations:
      io.cilium/lb-ipam-ips: 192.168.31.2

  #
  # -- Extra objects to deploy (value evaluated as a template)
  #
  # In some cases, it can avoid the need for additional, extended or adhoc deployments.
  # See #595 for more details and traefik/tests/values/extra.yaml for example.
  extraObjects:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: traefik-cert
    spec:
      secretName: traefik-cert
      dnsNames:
      - "{{ .Values.ingressHost }}"
      issuerRef:
        name: letsencrypt-production
        kind: ClusterIssuer

  - |
    apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: legacy-cert
    spec:
      secretName: legacy-cert
      dnsNames:
      {{- range .Values.legacyUrls }}
      - {{ . }}
      {{- end }}
      issuerRef:
        name: letsencrypt-production
        kind: ClusterIssuer

  # Replace with web.redirections in the future when the DNS01 challenge is used.
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: https-redirect
    spec:
      redirectScheme:
        scheme: https
        permanent: true

  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: dashboard-auth
    spec:
      basicAuth:
        secret: basic-auth-users

  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: api-strip
    spec:
      stripPrefix:
        prefixes:
        - /api

  - apiVersion: v1
    kind: Service
    metadata:
      name: legacy-traefik
    spec:
      externalName: 192.168.1.20
      type: ExternalName
      ports:
      - port: 443

  - apiVersion: traefik.io/v1alpha1
    kind: IngressRouteTCP
    metadata:
      name: legacy-router
    spec:
      entryPoints:
      - web
      - websecure
      routes:
      - match: "{{ include \"traefik.tcpRouterRule\" .Values.legacyUrls }}"
        services:
        - name: legacy-traefik
          port: 443
      tls:
        passthrough: true

  - apiVersion: traefik.io/v1alpha1
    kind: TLSStore
    metadata:
      name: default
    spec:
      certificates:
      - secretName: legacy-cert

  - apiVersion: traefik.io/v1alpha1
    kind: TLSOption
    metadata:
      name: default
    spec:
      minVersion: VersionTLS12
      sniStrict: true
