apiVersion: v2
name: media
description: A Helm chart for Plex, Jellyfin, Seerr, the *arr stack and a VPN-tunnelled download client

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.0

dependencies:
  - name: bazarr
    version: 2.3.2
    repository: oci://ghcr.io/m0nsterrr/helm-charts
  - name: flaresolverr
    version: 2.4.1
    repository: oci://ghcr.io/m0nsterrr/helm-charts
    condition: flaresolverr.enabled
  - name: jellyfin
    version: 3.2.0
    repository: https://jellyfin.github.io/jellyfin-helm
  - name: oauth2-proxy
    version: 10.7.1
    repository: https://oauth2-proxy.github.io/manifests
  - name: plex-media-server
    version: 1.9.0
    repository: https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages
  - name: prowlarr
    version: 3.8.5
    repository: oci://ghcr.io/m0nsterrr/helm-charts
  - name: qbittorrent
    version: 7.1.3
    repository: oci://ghcr.io/m0nsterrr/helm-charts
  - name: radarr
    version: 3.6.4
    repository: oci://ghcr.io/m0nsterrr/helm-charts
  - name: seerr-chart
    version: 3.11.1
    repository: oci://ghcr.io/seerr-team/seerr
  - name: sonarr
    version: 2.2.3
    repository: oci://ghcr.io/m0nsterrr/helm-charts
