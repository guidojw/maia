# Set at install time; used by the TransIP ClusterIssuers in extraObjects.
global:
  transip:
    accountName: ""

cert-manager:
  # +docs:section=Global

  # Default values for cert-manager.
  # This is a YAML-formatted file.
  # Declare variables to be passed into your templates.

  # Create dynamic manifests via values.
  #
  # For example:
  # extraObjects:
  #   - |
  #     apiVersion: v1
  #     kind: ConfigMap
  #     metadata:
  #       name: '{{ template "cert-manager.fullname" . }}-extra-configmap'
  extraObjects:
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-staging
    spec:
      acme:
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-issuer-account-key
        solvers:
        - http01:
            ingress:
              serviceType: ClusterIP
              ingressClassName: traefik
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-production
    spec:
      acme:
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-issuer-account-key
        solvers:
        - http01:
            ingress:
              serviceType: ClusterIP
              ingressClassName: traefik
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-transip-staging
    spec:
      acme:
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-transip-staging-account-key
        solvers:
        - dns01:
            webhook:
              groupName: acme.transip.nl
              solverName: transip
              config:
                accountName: '{{ required "global.transip.accountName is required" .Values.global.transip.accountName }}'
                ttl: 300
                privateKeySecretRef:
                  name: transip-secret
                  key: privateKey
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-transip-production
    spec:
      acme:
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-transip-production-account-key
        solvers:
        - dns01:
            webhook:
              groupName: acme.transip.nl
              solverName: transip
              config:
                accountName: '{{ required "global.transip.accountName is required" .Values.global.transip.accountName }}'
                ttl: 300
                privateKeySecretRef:
                  name: transip-secret
                  key: privateKey
