---
- name: Configure kernel settings
  hosts: maia
  become: true
  roles:
    - role: sysctl

- name: Set up network
  hosts: maia
  become: true
  roles:
    - role: network

- name: Run k3s-ansible playbook
  become: true
  import_playbook: collections/ansible_collections/techno_tim/k3s_ansible/site.yml

- name: Set up NVIDIA GPU
  hosts: maia
  become: true
  roles:
    - role: nvidia
      when: nvidia_gpu | default(false)

- name: Configure k3s cluster
  hosts: maia
  roles:
    - role: k3s_post
