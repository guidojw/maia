---
- name: Install Helm
  become: true
  ansible.builtin.unarchive:
    src: https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
    dest: /usr/local/bin
    extra_opts: --strip-components=1
    owner: root
    group: root
    mode: 0755
    remote_src: true
  args:
    creates: /usr/local/bin/helm

- name: Install Proxmox Cloud Controller Manager
  include_tasks: install_proxmox_cloud_controller_manager.yml

- name: Install Proxmox CSI Plugin
  include_tasks: install_proxmox_csi_plugin.yml
