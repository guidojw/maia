parent_interface: eth0
vlans:
  - id: 10
    routes:
      - to: default
        via: 192.168.30.1
        table: 300
    routing_policy:
      - table: 300
        from: "{{ k3s_node_ip }}"
        to: 192.168.1.0/24
        priority: 100
      - table: 300
        from: "{{ cilium_bgp_lb_ipv4_cidr }}"
        to: 192.168.1.0/24
        priority: 100
