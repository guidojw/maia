parent_interface: eth0
vlan1_ipv4_cidr: "{{ ansible_facts[parent_interface].ipv4.network }}/{{ ansible_facts[parent_interface].ipv4.prefix }}"
vlan1_ipv6_cidr: "{% set ipv6 = ansible_facts[parent_interface].ipv6 | selectattr('scope', 'equalto', 'global') | first %}{{ (ipv6.address ~ '/' ~ ipv6.prefix) | ansible.utils.ipaddr('network/prefix') }}"
vlan10_ipv6_cidr: "{{ (vlan10_ipv6_gateway ~ '/64') | ansible.utils.ipaddr('network/prefix') }}"
vlans:
  - id: 10
    routes:
      - to: default
        via: 192.168.30.1
        table: 300
      - to: default
        via: "{{ vlan10_ipv6_gateway }}"
        table: 301
    routing_policy:
      - table: 300
        from: "{{ apiserver_endpoint }}"
        to: "{{ vlan1_ipv4_cidr }}"
        priority: 100
      # Keep replies to the cluster (pods, services, other nodes) off the router, 254 is the main table.
      - table: 254
        from: "{{ cilium_bgp_lb_ipv4_cidr }}"
        to: "{{ cluster_cidr.split(',') | first }}"
        priority: 100
      - table: 254
        from: "{{ cilium_bgp_lb_ipv4_cidr }}"
        to: "{{ service_cidr.split(',') | first }}"
        priority: 100
      - table: 254
        from: "{{ cilium_bgp_lb_ipv4_cidr }}"
        to: 192.168.30.0/24
        priority: 100
      - table: 300
        from: "{{ cilium_bgp_lb_ipv4_cidr }}"
        priority: 101
      - table: 301
        from: "{{ ansible_default_ipv6.address }}/128"
        to: "{{ vlan1_ipv6_cidr }}"
        priority: 100
      - table: 254
        from: "{{ cilium_bgp_lb_ipv6_cidr }}"
        to: "{{ cluster_cidr.split(',') | last }}"
        priority: 100
      - table: 254
        from: "{{ cilium_bgp_lb_ipv6_cidr }}"
        to: "{{ service_cidr.split(',') | last }}"
        priority: 100
      - table: 254
        from: "{{ cilium_bgp_lb_ipv6_cidr }}"
        to: "{{ vlan10_ipv6_cidr }}"
        priority: 100
      - table: 301
        from: "{{ cilium_bgp_lb_ipv6_cidr }}"
        priority: 101
